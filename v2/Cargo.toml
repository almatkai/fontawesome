[package]
name = "fontawesome-v2"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
build = "build.rs"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
base64 = "0.22"
roxmltree = "0.20"
tempfile = "3"

[dev-dependencies]
rcgen = "=0.13.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[[bin]]
name = "fontawesome-v2"
path = "src/main.rs"
