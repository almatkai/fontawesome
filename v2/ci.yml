# Reference workflow: intentionally lives inside v2, so it is NOT activated in .github/workflows.
# Parent may copy it after review. It performs no publication or live service calls.
name: Font Awesome Rust V2 verification
on: [workflow_dispatch]
jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        toolchain: [stable, '1.85.0']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
# Source-oracle, host-contract and packaging commands are in scripts/verify.py.
# No MSVC/Windows result is claimed until this definition actually runs there.
